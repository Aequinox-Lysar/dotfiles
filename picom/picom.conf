# Shadows
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.6;
shadow-offset-x = -3;
shadow-offset-y = -3;
shadow-exclude = [
  "class_g ?= 'i3-frame'"
];

# Round Corners
round-borders: 1;
corner-radius: 10;

# Fading
fading = true;
fade-in-step = 0.015;
fade-out-step = 0.03;
fade-delta = 10;

# Background-Blurring
blur-size = 15;

blur: {
  method = "dual_kawase";
  strength = 10;
  deviation =1.0;
  background = false;
  background-frame = false;
  background-fixed = false;
  kern = "3x3box";
}

# General settings
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow =false; }
  popup_menu = { opacity = 1; }
  dropdown_menu = { opacity = 1; }
};
