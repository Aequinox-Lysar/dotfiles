[colors]
background = #1e1e2e
background-alt = #2a2a3f
foreground = #C5C8C6
primary = #FF00FF
secondary = #00FFFF
alert = #ff5555
disabled = #555555

[bar/example]
width = 100%
height = 24pt
radius = 6

locale = de_DE.UTF-8

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = MartianMono Nerd Font,MartianMonoNF:style=Regular

modules-left = powermenu xworkspaces
modules-center = date
modules-right = filesystem pulseaudio xkeyboard memory cpu battery wlan eth

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

#[module/xwindow]
#type = internal/xwindow
#label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#FF00FF}󱊟 %mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format-prefix = " "
format-prefix-foreground = ${colors.primary}
label-layout = %layout%
label-layout-foreground = ${colors.foreground}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
full-at = 99
low-at = 5

#format-charging-prefix = "BAT "
#format-charging-prefix-foreground = ${colors.primary}
#format-discharging-prefix = "BAT "
#format-discharging-prefix-foreground = ${colors.primary}
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

label-charging = %{F#1DB954}%{F-} %percentage%%
label-discharging = %{F#C50000}%{F-} %percentage%%
label-full = %{F#1DB954}Akku ist voll%{F-}
label-low = %{F#1DB954}BATTERY LOW%{F-}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
animation-discharging-framerate = 500

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#FF00FF}%{F-} %essid%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674} %{F-} %local_ip%
label-disconnected = ""

#[module/gsm]
#type = internal/network
#interface = wwp0s20f0u7
#label-connected = %{F#F0C674} %{F-} %{F#F1DB954}AN%{F-}
#label-disconnected = %{F#F0C674} %{F-} %{F#C50000}AUS%{F-}  

[module/date]
type = internal/date
interval = 1

date = %A der %d.%m.%Y %H:%M Uhr
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.secondary}

[module/powermenu]
type = custom/menu
expand-right = true
format-spacing = 1
label-open = %{FFF00FF}%{T2}  %{T-}%{F-}
label-close = %{FC50000}%{T2} %{T-}%{F-}
label-separator = " "
label-separator-foreground = ${colors.foreground}
menu-0-0 = %{F0B7A43}%{T2}󰑓 %{T-}%{F-}
menu-0-0-exec = menu-open-1
menu-0-1 =  %{FC50000}%{T2} %{T-}%{F-}
menu-0-1-exec = menu-open-2
menu-0-2 = %{FFF7A00}%{T2}󰍃 %{T-}%{F-}
menu-0-2-exec = menu-open-3
menu-1-0 = "Cancel"
menu-1-0-exec = menu-open-0
menu-1-0-foreground = ${colors.foreground}
menu-1-1 = "Reboot"
menu-1-1-exec = systemctl reboot
menu-1-1-foreground = ${colors.primary}
menu-2-1 = "Ausschalten"
menu-2-1-exec = systemctl poweroff
menu-2-1-foreground = ${colors.primary}
menu-2-0 = "Cancel"
menu-2-0-exec = menu-open-0
menu-2-0-foreground = ${colors.foreground}
menu-3-0 = "Cancel"
menu-3-0-exec = menu-open-0
menu-3-0-foreground = ${colors.foreground}
menu-3-1 = "Abmelden"
menu-3-1-exec = i3-msg exit
menu-3-1-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
